<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP 课程助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        .header p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }
        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .model-selector label {
            font-size: 12px;
            font-weight: 500;
        }
        .model-selector select {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }
        .model-selector select option {
            background: #667eea;
            color: white;
        }
        .chat-area {
            flex: 1;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-items: flex-end;
        }
        .message.assistant {
            align-items: flex-start;
        }
        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }
        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .message .model-tag {
            font-size: 10px;
            opacity: 0.7;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .message.user .model-tag {
            color: #667eea;
        }
        .message.assistant .model-tag {
            color: #764ba2;
        }
        .input-area {
            display: flex;
            flex-direction: column;
            padding: 16px;
            background: white;
            border-top: 1px solid #eee;
        }
        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }
        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
            min-height: 48px;
            max-height: 120px;
        }
        #userInput:focus {
            border-color: #667eea;
        }
        #sendBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .clear-btn {
            background: none;
            border: 1px solid #e0e0e0;
            color: #666;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .clear-btn:hover {
            background: #f0f0f0;
        }
        .status {
            font-size: 12px;
            color: #666;
        }
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                max-width: 100%;
            }
            .chat-area {
                min-height: 300px;
                padding: 16px;
            }
            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>NLP 课程助手</h1>
                <p>基于大语言模型</p>
            </div>
            <div class="model-selector">
                <label for="modelSelect">模型：</label>
                <select id="modelSelect">
                    <option value="qwen">通义千问</option>
                    <option value="deepseek">DeepSeek</option>
                </select>
            </div>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="input-area">
            <div class="input-row">
                <textarea id="userInput" placeholder="请输入您的问题..." onkeypress="handleKeyPress(event)"></textarea>
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
            <div class="controls">
                <button class="clear-btn" onclick="clearChat()">清空对话</button>
                <div class="status" id="status">就绪</div>
            </div>
        </div>
    </div>

    <script>
        // 对话历史
        let chatHistory = [];
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const chatArea = document.getElementById('chatArea');
            const modelSelect = document.getElementById('modelSelect');
            const model = modelSelect.value;
            const modelName = model === 'qwen' ? '通义千问' : 'DeepSeek';

            // 添加用户消息
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `
                <div class="model-tag">我</div>
                <div class="message-content">${escapeHtml(message)}</div>
            `;
            chatArea.appendChild(userMsg);

            // 清空输入框
            input.value = '';
            
            // 禁用发送按钮
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading"></span>';
            
            // 更新状态
            document.getElementById('status').textContent = `正在 ${modelName} 思考...`;

            // 添加助手消息占位
            const assistantMsg = document.createElement('div');
            assistantMsg.className = 'message assistant';
            assistantMsg.innerHTML = `
                <div class="model-tag">${modelName}</div>
                <div class="message-content">思考中...</div>
            `;
            chatArea.appendChild(assistantMsg);

            // 滚动到底部
            chatArea.scrollTop = chatArea.scrollHeight;

            try {
                // 构建对话历史
                const messages = chatHistory.map(msg => ({
                    role: msg.role,
                    content: msg.content
                }));

                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        model: model,
                        messages: messages
                    })
                });
                
                const data = await response.json();

                if (data.error) {
                    assistantMsg.querySelector('.message-content').textContent = '错误: ' + data.error;
                } else {
                    assistantMsg.querySelector('.message-content').textContent = data.answer;
                    
                    // 更新对话历史
                    chatHistory.push({ role: 'user', content: message });
                    chatHistory.push({ role: 'assistant', content: data.answer });
                }
            } catch (error) {
                assistantMsg.querySelector('.message-content').textContent = '网络错误，请重试。';
            }

            // 恢复按钮状态
            sendBtn.disabled = false;
            sendBtn.innerHTML = '发送';
            document.getElementById('status').textContent = '就绪';
            
            // 滚动到底部
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = '';
            chatHistory = [];
            document.getElementById('status').textContent = '已清空对话';
            setTimeout(() => {
                document.getElementById('status').textContent = '就绪';
            }, 2000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
